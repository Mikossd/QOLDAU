<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgRakhat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00afca"/>
      <stop offset="100%" stop-color="#007a8c"/>
    </linearGradient>
    <linearGradient id="goldRakhat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background chocolate wrapper -->
  <rect x="20" y="20" width="280" height="180" rx="8" fill="url(#bgRakhat)" filter="url(#sh)"/>
  <!-- Gold ornament border -->
  <rect x="26" y="26" width="268" height="168" rx="6" fill="none" stroke="url(#goldRakhat)" stroke-width="2" stroke-dasharray="8,4"/>
  <!-- Sun and eagle emblem -->
  <circle cx="160" cy="72" r="28" fill="none" stroke="url(#goldRakhat)" stroke-width="2"/>
  <circle cx="160" cy="72" r="16" fill="url(#goldRakhat)"/>
  <!-- Steppe eagle silhouette -->
  <path d="M144 86 Q160 76 176 86 Q160 81 144 86 Z" fill="url(#goldRakhat)"/>
  <!-- Brand and Name -->
  <text x="160" y="125" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">РАХАТ • RAKHAT</text>
  <text x="160" y="152" font-family="'Georgia', serif" font-size="20" font-weight="bold" fill="url(#goldRakhat)" text-anchor="middle" letter-spacing="1">ҚАЗАҚСТАН</text>
  <text x="160" y="170" font-family="sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">ТЕМНЫЙ ШОКОЛАД • 100 г</text>
</svg>